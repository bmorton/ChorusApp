{{/* {{< shot name="overview" alt="…" caption="…" >}}: a screenshot of the
     app from static/shots, in the light or dark version that matches the
     page. class="narrow" for a small one. The pictures are rendered from
     the app's own screen catalog against made-up data. */}}
{{- $name := .Get "name" -}}
<figure class="shot {{ .Get "class" }}">
  <img class="shot-light" src="{{ printf "shots/%s-light.png" $name | relURL }}" alt="{{ .Get "alt" }}" loading="lazy">
  <img class="shot-dark" src="{{ printf "shots/%s-dark.png" $name | relURL }}" alt="{{ .Get "alt" }}" loading="lazy">
  {{- with .Get "caption" }}<figcaption>{{ . }}</figcaption>{{ end }}
</figure>
