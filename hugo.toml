baseURL = "https://chorus.bmorton.dev/"
title = "Chorus"
locale = "en-us"

enableInlineShortcodes = true

[module]
  [[module.imports]]
    path = "github.com/imfing/hextra"

[markup]
  # The home page lays out its headline with HTML around shortcodes.
  [markup.goldmark.renderer]
    unsafe = true
  [markup.highlight]
    noClasses = false

[menu]
  [[menu.main]]
    name = "Documentation"
    pageRef = "/docs"
    weight = 1
  [[menu.main]]
    name = "Download"
    weight = 2
    url = "https://github.com/bmorton/ChorusApp/releases"
  [[menu.main]]
    name = "Search"
    weight = 3
    [menu.main.params]
      type = "search"
  [[menu.main]]
    name = "GitHub"
    weight = 4
    url = "https://github.com/bmorton/ChorusApp"
    [menu.main.params]
      icon = "github"

[params]
  [params.navbar]
    displayTitle = true
    displayLogo = false
  [params.theme]
    default = "system"
    displayToggle = true
  [params.footer]
    enable = true
    displayCopyright = false
    displayPoweredBy = true
  [params.search]
    enable = true
    type = "flexsearch"
    [params.search.flexsearch]
      index = "content"
      tokenize = "forward"
